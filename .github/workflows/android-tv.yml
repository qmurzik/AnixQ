name: Android TV

on:
  push:
    branches: [ "main" ]
    paths: [ "android/**", ".github/workflows/android-tv.yml" ]
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Run the TV emulator and take screenshots"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      # Without a key in the secrets, keep the runner's debug key between builds so updates install over each other.
      - uses: actions/cache@v4
        with: { path: ~/.android/debug.keystore, key: anixq-tv-debug-keystore }
      - id: v
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Signing key from secrets (optional)
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; fi
      - name: Build
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk AnixQ-TV.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: AnixQ-TV.apk }
      - name: Publish release
        if: github.event_name == 'push'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V=${{ steps.v.outputs.version }}
          gh release create "tv-v$V" AnixQ-TV.apk --title "AnixQ TV $V" --notes "Android TV: установите AnixQ-TV.apk (Downloader → ссылка на файл)." --latest=false
          # Rolling link that always points at the newest TV build.
          gh release view tv >/dev/null 2>&1 || gh release create tv --title "AnixQ TV (последняя)" --notes "Постоянная ссылка на последнюю сборку для Android TV." --latest=false
          gh release upload tv AnixQ-TV.apk --clobber

  screenshots:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash android/ci/tv-shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: tv-shots, path: shots }

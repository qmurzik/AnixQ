name: Android TV

on:
  push:
    branches: [ "main" ]
    paths: [ "android/**", ".github/workflows/android-tv.yml" ]
  # Keeps the cached signing key alive (caches expire after 7 days without use).
  schedule:
    - cron: "41 4 */4 * *"
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Run the TV emulator and take screenshots"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      # One signing key for every build, so the app can update itself over the installed version.
      # A key in the repository secrets wins; otherwise a key made once and kept in the Actions cache
      # (the "keepalive" job below touches it so it never expires).
      - uses: actions/cache@v4
        with: { path: ~/anixq-tv-signing.p12, key: anixq-tv-signing-v1 }
      - id: v
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          else
            [ -f ~/anixq-tv-signing.p12 ] || keytool -genkeypair -keystore ~/anixq-tv-signing.p12 -storetype PKCS12 \
              -storepass anixq-tv -keypass anixq-tv -alias anixq -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=AnixQ TV"
            echo "ANDROID_KEYSTORE=$HOME/anixq-tv-signing.p12" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=anixq-tv" >> "$GITHUB_ENV"
          fi
      - name: Remote-control focus tests
        continue-on-error: true
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest --tests 'ru.qmods.anixq.tv.focus.*'
      - name: Build (TV + phone)
        working-directory: android
        env: { BUILD_NUMBER: "${{ github.run_number }}" }
        run: gradle --no-daemon :app:assembleRelease :mobile:assembleRelease
      - run: |
          cp android/app/build/outputs/apk/release/app-release.apk AnixQ-TV.apk
          cp android/mobile/build/outputs/apk/release/mobile-release.apk AnixQ.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: AnixQ-TV.apk }
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: AnixQ.apk }
      - name: Publish release
        if: github.event_name == 'push'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V=${{ steps.v.outputs.version }}
          gh release create "tv-v$V" AnixQ-TV.apk --title "AnixQ TV $V" --notes "Android TV: установите AnixQ-TV.apk (Downloader → ссылка на файл)." --latest=false
          # Rolling link that always points at the newest TV build.
          gh release view tv >/dev/null 2>&1 || gh release create tv --title "AnixQ TV (последняя)" --notes "Постоянная ссылка на последнюю сборку для Android TV." --latest=false
          # What the app on the TV checks for updates.
          NOTES=$(git log -1 --format=%s)
          python3 -c "import json,sys; json.dump({'code': int(sys.argv[1]), 'name': sys.argv[2], 'notes': sys.argv[3][:300],
            'apk': 'https://github.com/${{ github.repository }}/releases/download/tv-v'+sys.argv[2]+'/AnixQ-TV.apk'}, open('tv-version.json','w'), ensure_ascii=False)" \
            "${{ github.run_number }}" "$V" "$NOTES"
          gh release upload tv AnixQ-TV.apk tv-version.json --clobber
          # Phone app: same version number, its own rolling release + update manifest.
          gh release create "android-v$V" AnixQ.apk --title "AnixQ для Android $V" --notes "Android-телефон: установите AnixQ.apk." --latest=false
          gh release view android >/dev/null 2>&1 || gh release create android --title "AnixQ для Android (последняя)" --notes "Постоянная ссылка на последнюю сборку для Android-телефонов." --latest=false
          python3 -c "import json,sys; json.dump({'code': int(sys.argv[1]), 'name': sys.argv[2], 'notes': sys.argv[3][:300],
            'apk': 'https://github.com/${{ github.repository }}/releases/download/android-v'+sys.argv[2]+'/AnixQ.apk'}, open('android-version.json','w'), ensure_ascii=False)" \
            "${{ github.run_number }}" "$V" "$NOTES"
          gh release upload android AnixQ.apk android-version.json --clobber

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with: { path: ~/anixq-tv-signing.p12, key: anixq-tv-signing-v1 }

  screenshots:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash android/ci/tv-shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: tv-shots, path: shots }

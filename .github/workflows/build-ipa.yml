name: Build IPA

on:
  push:
    branches: [ "main" ]
    # Site-only changes don't produce an app release.
    paths-ignore: [ "site/**", "scripts/build_site.py", ".github/workflows/pages.yml", ".github/workflows/preview.yml", "README.md", "android/**", ".github/workflows/android-tv.yml" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS arm64 hosted runners are often out of capacity; try several images in parallel.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Newest stable Xcode (26+ brings the iOS 26 SDK with Liquid Glass); betas and RCs are skipped.
          X=$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null | grep -viE 'beta|rc|release_candidate' | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
          xcodebuild -version | head -1 | awk '{print $2}' > xcode-version.txt

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project AnixQ.xcodeproj \
            -target AnixQ \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.0.$(( ${{ github.run_number }} + 37 ))" \
            CURRENT_PROJECT_VERSION="$(( ${{ github.run_number }} + 37 ))" \
            build | tee build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
          # iOS 26-only Swift overlays must not stop the app from launching on iOS 16–18:
          # mark them weak in every binary (debug builds keep code in AnixQ.debug.dylib), then re-sign ad hoc.
          for bin in build/Release-iphoneos/AnixQ.app/AnixQ build/Release-iphoneos/AnixQ.app/AnixQ.debug.dylib build/Release-iphoneos/AnixQ.app/PlugIns/*.appex/*; do
            [ -f "$bin" ] && file "$bin" | grep -q Mach-O || continue
            python3 scripts/weaken_dylibs.py "$bin" libswiftWebKit libswift_WebKit_SwiftUI
            codesign -f -s - "$bin" 2>/dev/null || true
            # Any symbol still bound strongly to an iOS 26-only library would crash older iOS at launch.
            BAD=$(nm -m "$bin" 2>/dev/null | grep -E "\(from libswift_?WebKit" | grep -v "weak" || true)
            if [ -n "$BAD" ]; then echo "::error::iOS 26-only WebKit symbols in $bin:"; echo "$BAD"; exit 1; fi
          done

      - name: Add loose alternate icons
        # Some re-signers and iOS versions only find alternate icons as loose PNGs listed in CFBundleIconFiles.
        run: |
          APP=build/Release-iphoneos/AnixQ.app
          PL="$APP/Info.plist"
          for NAME in AppIcon-Dark AppIcon-Ocean AppIcon-Mint AppIcon-Sunset; do
            SRC="AnixQ/Resources/Assets.xcassets/$NAME.appiconset/icon-1024.png"
            sips -z 120 120 "$SRC" --out "$APP/${NAME}60x60@2x.png" >/dev/null
            sips -z 180 180 "$SRC" --out "$APP/${NAME}60x60@3x.png" >/dev/null
            sips -z 152 152 "$SRC" --out "$APP/${NAME}76x76@2x~ipad.png" >/dev/null
            sips -z 167 167 "$SRC" --out "$APP/${NAME}83.5x83.5@2x~ipad.png" >/dev/null
            for KEY in CFBundleIcons "CFBundleIcons~ipad"; do
              /usr/libexec/PlistBuddy -c "Delete :$KEY:CFBundleAlternateIcons:$NAME:CFBundleIconFiles" "$PL" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :$KEY:CFBundleAlternateIcons:$NAME:CFBundleIconFiles array" "$PL"
              /usr/libexec/PlistBuddy -c "Add :$KEY:CFBundleAlternateIcons:$NAME:CFBundleIconFiles:0 string ${NAME}60x60" "$PL"
              /usr/libexec/PlistBuddy -c "Add :$KEY:CFBundleAlternateIcons:$NAME:UIPrerenderedIcon bool false" "$PL" 2>/dev/null || true
            done
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons~ipad:CFBundleAlternateIcons:$NAME:CFBundleIconFiles:1 string ${NAME}76x76" "$PL"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons~ipad:CFBundleAlternateIcons:$NAME:CFBundleIconFiles:2 string ${NAME}83.5x83.5" "$PL"
          done
          plutil -p "$PL" | grep -A4 AppIcon-Dark | head -12

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/AnixQ.app Payload/
          zip -qry AnixQ.ipa Payload
          ls -lh AnixQ.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnixQ-ipa-${{ matrix.os }}
          path: |
            AnixQ.ipa
            xcode-version.txt

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  release:
    # Publishes the IPA as a GitHub release and refreshes the GBox source on branch gbox-source.
    needs: build
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: AnixQ-ipa-*
          path: dl
      - name: Pick IPA
        run: |
          # Prefer the build made with the newest Xcode (real Liquid Glass on iOS 26).
          IPA=""; BEST=0
          for d in dl/*/; do
            [ -f "$d/AnixQ.ipa" ] || continue
            [ "$(stat -c%s "$d/AnixQ.ipa")" -gt 100000 ] || continue
            V=$(cat "$d/xcode-version.txt" 2>/dev/null | cut -d. -f1); V=${V:-0}
            echo "$d Xcode $V"
            if [ -z "$IPA" ] || [ "$V" -gt "$BEST" ]; then IPA="$d/AnixQ.ipa"; BEST=$V; fi
          done
          test -n "$IPA"
          cp "$IPA" AnixQ.ipa
          echo "IPA_SIZE=$(stat -c%s AnixQ.ipa)" >> "$GITHUB_ENV"
          echo "VERSION=1.0.$(( ${{ github.run_number }} + 37 ))" >> "$GITHUB_ENV"
      - name: Release notes
        run: |
          # Every app change since the previous release (site-only commits are skipped).
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          RANGE=${PREV:+$PREV..}HEAD
          git log --no-merges --pretty='• %s' $RANGE -- . ':!site' ':!scripts/build_site.py' ':!.github/workflows/pages.yml' | head -40 > notes.txt
          [ -s notes.txt ] || git log -1 --pretty=%B > notes.txt
          cat notes.txt
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: AnixQ ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: notes.txt
          files: AnixQ.ipa
          make_latest: true
      - name: Update GBox source
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          BASE="https://raw.githubusercontent.com/$REPO/gbox-source"
          python3 scripts/gbox_source.py gbox.json "$VERSION" \
            "https://github.com/$REPO/releases/download/v$VERSION/AnixQ.ipa" \
            "$BASE/icon.png" "$IPA_SIZE" "$(cat notes.txt)"
          mkdir src && cd src
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:$TOKEN@github.com/$REPO.git"
          if git fetch -q origin gbox-source; then git checkout -q -b gbox-source FETCH_HEAD; else git checkout -q --orphan gbox-source; fi
          cp ../gbox.json gbox.json
          cp ../AnixQ/Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png icon.png
          printf '# AnixQ — источник GBox\n\nДобавьте в GBox источник:\n\n    %s/gbox.json\n' "$BASE" > README.md
          git add -A
          git commit -q -m "AnixQ $VERSION" || exit 0
          git push -q origin gbox-source

      - name: Announce in Telegram
        # Optional: add repository secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID (e.g. @anixq_channel).
        if: ${{ env.TG_TOKEN != '' && env.TG_CHAT != '' }}
        run: |
          python3 - <<'PY'
          import html, json, os, urllib.request
          notes = html.escape(open("notes.txt", encoding="utf-8").read().strip()[:3000])
          version = os.environ["VERSION"]
          text = (f"<b>AnixQ {version}</b>\n\n{notes}\n\n"
                  "Обновить: GBox → источник AnixQ → «Обновить»\n"
                  f"<a href=\"https://github.com/${{ github.repository }}/releases/tag/v{version}\">IPA</a> · "
                  "<a href=\"https://qmurzik.github.io/AnixQ/\">Сайт</a>")
          body = json.dumps({"chat_id": os.environ["TG_CHAT"], "text": text, "parse_mode": "HTML",
                             "disable_web_page_preview": True}).encode()
          req = urllib.request.Request(f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage", data=body,
                                       headers={"Content-Type": "application/json"})
          print(urllib.request.urlopen(req, timeout=30).status)
          PY

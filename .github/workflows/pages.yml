name: Site

on:
  push:
    branches: [ "main" ]
    paths: [ "site/**", "scripts/build_site.py", ".github/workflows/pages.yml" ]
  # Refresh the changelog after every app release.
  workflow_run:
    workflows: [ "Build IPA", "Android TV" ]
    types: [ completed ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_site.py _site
      - name: Latest TV app next to the install page (short direct link for Downloader)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download tv -p AnixQ-TV.apk --output _site/tv.apk --repo "${{ github.repository }}" || echo "no TV build yet"
      - name: Latest Android phone app next to its page
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download android -p AnixQ.apk --output _site/android.apk --repo "${{ github.repository }}" || echo "no Android build yet"
      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Site ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

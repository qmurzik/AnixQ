name: Preview

# Manual run: builds for the iOS simulator and takes screenshots of the main screens and the player
# (portrait and landscape). Results are uploaded as the "preview" artifact.
on:
  workflow_dispatch:
    inputs:
      styles:
        description: "UI styles to capture"
        default: "classic glass material"
      player:
        description: "Player version (old/new)"
        default: "new"

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          X=$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null | grep -viE 'beta|rc|release_candidate' | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"; xcodebuild -version
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project AnixQ.xcodeproj -target AnixQ -configuration Debug \
            -sdk iphonesimulator -arch arm64 SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build \
            | tee sim.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" sim.log
      - name: Screenshots
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9] Pro \(|iPhone [0-9]+ Pro \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          [ -n "$DEVICE" ] || DEVICE=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "Device: $DEVICE"
          xcrun simctl boot "$DEVICE"; xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$DEVICE" build/Debug-iphonesimulator/AnixQ.app
          mkdir -p preview
          BASE="-onboarding.done YES -playerVersion ${{ inputs.player }}"
          shot() { # name, wait, args...
            name=$1; wait=$2; shift 2
            xcrun simctl terminate "$DEVICE" ru.qmods.anixq 2>/dev/null || true
            xcrun simctl launch "$DEVICE" ru.qmods.anixq $BASE "$@" >/dev/null
            sleep "$wait"
            xcrun simctl io "$DEVICE" screenshot "preview/$name.png" >/dev/null
          }
          for st in ${{ inputs.styles }}; do
            shot "${st}_1home" 22 -uiStyle $st
            shot "${st}_2title" 22 -uiStyle $st -screenshotSlug 14421--kimetsu-no-yaiba-anime
            shot "${st}_3library" 12 -uiStyle $st -screenshotTab 3
          done
          shot classic_4browse 18 -screenshotTab 1
          shot classic_5search 10 -screenshotTab 4
          shot classic_6light 22 -appearance light
          # Player: portrait first, then the app rotates it to landscape.
          xcrun simctl terminate "$DEVICE" ru.qmods.anixq 2>/dev/null || true
          xcrun simctl launch "$DEVICE" ru.qmods.anixq $BASE -autoplaySlug 14421--kimetsu-no-yaiba-anime -autoplayTeam AniLibria -autoLandscapeAfter 35 >/dev/null
          for t in 12 24 34; do sleep 11; xcrun simctl io "$DEVICE" screenshot "preview/player_portrait_${t}s.png" >/dev/null; done
          sleep 14; xcrun simctl io "$DEVICE" screenshot preview/player_landscape_48s.png >/dev/null
          sleep 12; xcrun simctl io "$DEVICE" screenshot preview/player_landscape_60s.png >/dev/null
          DATA=$(xcrun simctl get_app_container "$DEVICE" ru.qmods.anixq data)
          cp "$DATA/Library/Caches/debug.log" preview/player.log 2>/dev/null || true
          ls preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview
          path: |
            preview
            sim.log

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Подборка аниме — AnixQ</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta property="og:title" content="Подборка аниме в AnixQ">
<meta property="og:description" content="Друг поделился подборкой аниме. Откройте её в AnixQ или посмотрите здесь.">
<meta property="og:image" content="https://qmurzik.github.io/AnixQ/og.png">
<style>
  :root { --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --stroke:rgba(255,255,255,.08); --text:#fff; --muted:#8e8e93;
          --pink:#ff4d7a; --violet:#8c52ff; --grad:linear-gradient(100deg,#ff4d7a,#8c52ff); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); }
  body { font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif; min-height:100vh; }
  a { color:inherit; text-decoration:none; }

  /* Hero: blurred collage of the covers, like a title page header */
  .hero { position:relative; overflow:hidden; padding:calc(env(safe-area-inset-top) + 18px) 0 26px; }
  .collage { position:absolute; inset:-40px; display:grid; grid-template-columns:repeat(5,1fr); gap:6px; filter:blur(22px) saturate(1.3); opacity:.55; transform:scale(1.1); }
  .collage div { aspect-ratio:2/3; background:#222 center/cover; border-radius:10px; }
  .hero::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.1) 35%,rgba(0,0,0,.85) 80%,#000 100%); }
  .hero-in { position:relative; z-index:1; max-width:880px; margin:0 auto; padding:0 18px; text-align:center; }
  .brand { display:inline-flex; align-items:center; gap:8px; font-weight:800; font-size:15px; padding:6px 12px 6px 6px;
           background:rgba(0,0,0,.4); border:.5px solid rgba(255,255,255,.15); border-radius:999px; }
  .brand img { width:24px; height:24px; border-radius:7px; }
  .stack { display:flex; justify-content:center; margin:26px 0 14px; height:150px; }
  .stack div { width:96px; aspect-ratio:2/3; border-radius:12px; background:#222 center/cover; box-shadow:0 12px 30px rgba(0,0,0,.6);
               border:.5px solid rgba(255,255,255,.15); margin:0 -18px; }
  .stack div:nth-child(1) { transform:rotate(-9deg) translateY(14px); }
  .stack div:nth-child(2) { transform:translateY(-4px); z-index:2; width:104px; }
  .stack div:nth-child(3) { transform:rotate(9deg) translateY(14px); }
  .emoji { font-size:44px; line-height:1; margin:18px 0 0; }
  h1 { margin:8px 0 4px; font-size:32px; line-height:1.1; font-weight:900; letter-spacing:-.02em; text-shadow:0 4px 20px rgba(0,0,0,.5); }
  .sub { color:rgba(255,255,255,.75); font-size:15px; }
  .actions { display:flex; gap:10px; max-width:460px; margin:20px auto 0; }
  .btn { flex:1; display:flex; align-items:center; justify-content:center; gap:8px; min-height:50px; padding:0 18px; border-radius:14px;
         font-family:inherit; font-weight:700; font-size:16px; color:#fff; background:var(--grad); box-shadow:0 10px 26px rgba(255,77,122,.35);
         border:1px solid rgba(255,255,255,.18); }
  .btn.ghost { flex:0 0 auto; background:rgba(255,255,255,.12); box-shadow:none; border:.5px solid rgba(255,255,255,.18); }
  .btn svg { width:18px; height:18px; fill:currentColor; }

  main { max-width:880px; margin:0 auto; padding:6px 16px 48px; }
  .bar { display:flex; align-items:center; justify-content:space-between; margin:8px 0 14px; }
  .bar h2 { font-size:21px; margin:0; }
  .seg { display:flex; background:var(--card2); border-radius:9px; padding:2px; }
  .seg button { border:0; background:none; color:var(--text); font-family:inherit; font-weight:600; font-size:13px; line-height:1; padding:7px 11px; border-radius:7px; cursor:pointer; }
  .seg button.on { background:#fff; color:#000; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:18px 12px; }
  .card { cursor:pointer; transition:transform .15s; }
  .card:active { transform:scale(.97); }
  .poster { position:relative; aspect-ratio:2/3; border-radius:12px; overflow:hidden; background:var(--card); border:.5px solid var(--stroke);
            box-shadow:0 6px 14px rgba(0,0,0,.35); }
  .poster img { width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity .3s; }
  .poster img.ok { opacity:1; }
  .poster .ph { position:absolute; inset:0; background:linear-gradient(110deg,#1c1c1e 30%,#2a2a2d 50%,#1c1c1e 70%); background-size:300% 100%; animation:sh 1.3s linear infinite; }
  @keyframes sh { from { background-position:100% 0 } to { background-position:-100% 0 } }
  .num { position:absolute; left:6px; bottom:6px; min-width:22px; height:22px; padding:0 6px; border-radius:11px; background:rgba(0,0,0,.6);
         font-family:inherit; font-weight:800; font-size:12px; line-height:22px; text-align:center; }
  .score { position:absolute; left:6px; top:6px; padding:2px 6px; border-radius:6px; font-family:inherit; font-weight:800; font-size:11px; line-height:16px; color:rgba(0,0,0,.85); }
  .card .t { margin-top:7px; font-weight:600; font-size:13px; line-height:16px; height:32px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .card .m { color:var(--muted); font-size:11px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .rows { display:none; background:var(--card); border-radius:14px; overflow:hidden; }
  .row { display:flex; gap:12px; align-items:center; padding:10px 12px; cursor:pointer; position:relative; }
  .row + .row::before { content:""; position:absolute; top:0; left:80px; right:0; border-top:.5px solid rgba(255,255,255,.1); }
  .row .poster { width:56px; flex:none; border-radius:8px; box-shadow:none; }
  .row .t { font-weight:600; font-size:15px; }
  .row .m { color:var(--muted); font-size:12px; }
  .row .g { color:var(--muted); font-size:12px; margin-top:2px; }
  .list .grid { display:none; } .list .rows { display:block; }

  /* Bottom sheet with details */
  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .25s; z-index:10; }
  .sheet { position:fixed; left:0; right:0; bottom:0; max-height:88vh; overflow:auto; background:#111; border-radius:20px 20px 0 0;
           transform:translateY(100%); transition:transform .3s cubic-bezier(.2,.8,.2,1); z-index:11; max-width:640px; margin:0 auto;
           padding-bottom:calc(env(safe-area-inset-bottom) + 18px); visibility:hidden; }
  .open .sheet { visibility:visible; }
  .x { position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%; border:0; background:rgba(0,0,0,.55); color:#fff; font-size:18px; line-height:32px; z-index:2; cursor:pointer; }
  .open .sheet-bg { opacity:1; pointer-events:auto; } .open .sheet { transform:none; }
  .sheet .art { height:220px; background:#222 center/cover; position:relative; }
  .sheet .art::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,transparent 30%,#111); }
  .sheet .grab { position:absolute; top:8px; left:50%; width:38px; height:5px; margin-left:-19px; border-radius:3px; background:rgba(255,255,255,.5); z-index:1; }
  .sheet .body { padding:0 18px; margin-top:-70px; position:relative; z-index:1; }
  .sheet .head { display:flex; gap:14px; align-items:flex-end; }
  .sheet .head .poster { width:96px; flex:none; }
  .sheet h3 { margin:0; font-size:22px; line-height:1.15; font-weight:800; }
  .sheet .orig { color:var(--muted); font-size:13px; margin-top:3px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:14px 0 4px; }
  .chip { padding:5px 10px; border-radius:999px; background:var(--card2); font-size:12px; font-weight:600; }
  .chip.y { color:#ffd60a; } .chip.gr { color:#30d158; }
  .sheet p { color:#c7c7cc; font-size:15px; line-height:1.5; margin:12px 0 18px; white-space:pre-line; }
  .sheet .actions { margin:0; max-width:none; }
  .foot { text-align:center; color:var(--muted); font-size:13px; margin-top:34px; }
  .foot a { color:var(--pink); font-weight:600; }
  .err { text-align:center; padding:80px 20px; color:var(--muted); }
</style>
</head>
<body>
<div class="hero">
  <div class="collage" id="collage"></div>
  <div class="hero-in">
    <a class="brand" href="../"><img src="../favicon.png" alt="">AnixQ</a>
    <div class="stack" id="stack"></div>
    <div class="emoji" id="emoji">📺</div>
    <h1 id="name">Подборка</h1>
    <div class="sub" id="count"></div>
    <div class="actions">
      <a class="btn" id="open" href="#"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Открыть в AnixQ</a>
      <a class="btn ghost" id="share" href="#" aria-label="Поделиться"><svg viewBox="0 0 24 24"><path d="M12 2l4 4h-3v9h-2V6H8l4-4zm-7 9h3v2H6v7h12v-7h-2v-2h3a1 1 0 011 1v9a1 1 0 01-1 1H5a1 1 0 01-1-1v-9a1 1 0 011-1z"/></svg></a>
    </div>
  </div>
</div>
<main id="main">
  <div class="bar">
    <h2>Тайтлы</h2>
    <div class="seg"><button class="on" data-v="grid">Постеры</button><button data-v="list">Список</button></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="rows" id="rows"></div>
  <div class="foot">Нет AnixQ? <a href="../#install">Установить для iPhone, Android или ТВ</a></div>
</main>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<script>
(function () {
  var COVER = 'https://cover.imglib.info/uploads/anime/';
  var APIS = ['https://anixq-edge.qmurzik7.workers.dev/api', 'https://api.lib.social/api', 'https://api.cdnlibs.org/api'];
  var $ = function (id) { return document.getElementById(id); };
  var token = (location.hash || '').slice(1);
  var p;
  try {
    var b64 = token.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    p = JSON.parse(new TextDecoder().decode(bytes));
  } catch (e) {
    $('main').innerHTML = '<div class="err">Ссылка на подборку повреждена.<br>Попросите отправить её ещё раз.</div>';
    $('name').textContent = 'Подборка не открылась'; $('open').style.display = 'none'; $('share').style.display = 'none';
    return;
  }
  var items = (p.i || []).map(function (it, i) {
    var c = it[2] || null;
    if (c && c.indexOf('http') !== 0) c = COVER + c;
    return { slug: it[0], title: it[1], cover: c, n: i + 1 };
  });
  function plural(n, a, b, c) { var m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c); }
  var name = p.n || 'Подборка';
  $('emoji').textContent = p.e || '📺';
  $('name').textContent = name;
  document.title = name + ' — подборка в AnixQ';
  $('count').textContent = items.length + ' ' + plural(items.length, 'тайтл', 'тайтла', 'тайтлов');
  $('open').href = 'anixq://list/' + token;
  $('share').onclick = function (ev) {
    ev.preventDefault();
    if (navigator.share) navigator.share({ title: name, url: location.href }).catch(function () {});
    else if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function () { alert('Ссылка скопирована'); });
  };
  if (!items.length) { $('main').innerHTML = '<div class="err">В подборке пока пусто.</div>'; return; }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function scoreColor(s) { return s >= 8 ? '#30d158' : s >= 6.5 ? '#ff9f0a' : '#ff453a'; }
  function posterHTML(it) {
    return '<div class="poster"><div class="ph"></div>' + (it.cover ? '<img loading="lazy" alt="" src="' + esc(it.cover) + '" onload="this.className=\'ok\';this.previousSibling.remove()">' : '') +
      (it.score ? '<span class="score" style="background:' + scoreColor(it.score) + '">★ ' + it.score.toFixed(1) + '</span>' : '') + '</div>';
  }
  function meta(it) { return [it.type, it.year].filter(Boolean).join(' · '); }

  function render() {
    $('grid').innerHTML = items.map(function (it, i) {
      return '<div class="card" data-i="' + i + '">' + posterHTML(it) + '<div class="t">' + esc(it.title) + '</div><div class="m">' + esc(meta(it) || ' ') + '</div></div>';
    }).join('');
    $('rows').innerHTML = items.map(function (it, i) {
      return '<div class="row" data-i="' + i + '">' + posterHTML(it) + '<div><div class="t">' + esc(it.title) + '</div><div class="m">' + esc(meta(it)) +
        '</div>' + (it.genres ? '<div class="g">' + esc(it.genres.slice(0, 3).join(', ')) + '</div>' : '') + '</div></div>';
    }).join('');
    var covers = items.filter(function (it) { return it.cover; }).map(function (it) { return it.cover; });
    $('collage').innerHTML = covers.concat(covers, covers).slice(0, 20).map(function (c) { return '<div style="background-image:url(\'' + esc(c) + '\')"></div>'; }).join('');
    $('stack').innerHTML = covers.slice(0, 3).map(function (c) { return '<div style="background-image:url(\'' + esc(c) + '\')"></div>'; }).join('');
    $('stack').style.display = covers.length ? '' : 'none';
    $('emoji').style.display = covers.length ? 'none' : '';
  }
  render();

  document.querySelector('.seg').onclick = function (e) {
    var v = e.target.getAttribute('data-v'); if (!v) return;
    [].forEach.call(this.children, function (b) { b.classList.toggle('on', b === e.target); });
    $('main').classList.toggle('list', v === 'list');
  };
  $('main').onclick = function (e) {
    var el = e.target.closest('[data-i]'); if (el) openSheet(items[+el.getAttribute('data-i')]);
  };
  $('sheetBg').onclick = closeSheet;
  function closeSheet() { document.body.classList.remove('open'); }

  function openSheet(it) {
    var chips = [];
    if (it.score) chips.push('<span class="chip y">★ ' + it.score.toFixed(1) + '</span>');
    if (it.type) chips.push('<span class="chip">' + esc(it.type) + '</span>');
    if (it.year) chips.push('<span class="chip">' + esc(it.year) + '</span>');
    if (it.eps) chips.push('<span class="chip">' + esc(it.eps) + ' эп.</span>');
    if (it.status) chips.push('<span class="chip' + (it.ongoing ? ' gr' : '') + '">' + esc(it.status) + '</span>');
    if (it.age) chips.push('<span class="chip">' + esc(it.age) + '</span>');
    (it.genres || []).slice(0, 4).forEach(function (g) { chips.push('<span class="chip">' + esc(g) + '</span>'); });
    $('sheet').innerHTML = '<div class="art" style="background-image:url(\'' + esc(it.bg || it.cover || '') + '\')"><div class="grab"></div><button class="x" aria-label="Закрыть" onclick="document.body.classList.remove(\'open\')">✕</button></div>' +
      '<div class="body"><div class="head">' + posterHTML(it) + '<div><h3>' + esc(it.title) + '</h3>' + (it.orig ? '<div class="orig">' + esc(it.orig) + '</div>' : '') + '</div></div>' +
      '<div class="chips">' + chips.join('') + '</div>' +
      (it.summary ? '<p>' + esc(it.summary) + '</p>' : '<p style="color:var(--muted)">Описание загружается…</p>') +
      '<div class="actions"><a class="btn" href="anixq://title/' + encodeURIComponent(it.slug) + '"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Смотреть в AnixQ</a>' +
      '<a class="btn ghost" target="_blank" rel="noopener" href="https://anilib.me/ru/anime/' + encodeURIComponent(it.slug) + '">AnimeLib</a></div></div>';
    document.body.classList.add('open');
    current = it;
  }
  var current = null;

  // Details from AnimeLib's public API (covers, ratings, genres, descriptions), a few at a time.
  function text(node) {
    if (!node) return '';
    if (typeof node === 'string') return node;
    if (node.type === 'text') return node.text || '';
    var inner = (node.content || []).map(text).join('');
    return node.type === 'paragraph' ? inner + '\n' : inner;
  }
  function fetchOne(it, k) {
    var host = APIS[k || 0]; if (!host) return Promise.resolve();
    var q = ['summary', 'genres', 'background', 'releaseDate', 'episodes_count'].map(function (f) { return 'fields[]=' + f; }).join('&');
    return fetch(host + '/anime/' + encodeURIComponent(it.slug) + '?' + q, { headers: { 'Site-Id': '5' } })
      .then(function (r) { if (!r.ok) throw r.status; return r.json(); })
      .then(function (j) {
        var d = j.data || {};
        if (!it.cover && d.cover) it.cover = d.cover.default || d.cover.thumbnail;
        it.title = d.rus_name || it.title;
        it.orig = d.eng_name || d.name;
        if (it.orig === it.title) it.orig = null;
        it.type = d.type && d.type.label;
        var y = (d.releaseDateString || d.releaseDate || '').match(/(19|20)\d\d/); it.year = y && y[0];
        it.score = parseFloat(d.shiki_rate) || (d.rating && parseFloat(d.rating.average)) || null;
        it.genres = (d.genres || []).map(function (g) { return g.name; });
        it.bg = d.background && d.background.url && d.background.url.indexOf('placeholder') < 0 ? d.background.url : null;
        it.status = d.status && d.status.label; it.ongoing = d.status && d.status.id === 1;
        it.age = d.ageRestriction && d.ageRestriction.label;
        it.eps = d.items_count && d.items_count.total || null;
        it.summary = typeof d.summary === 'string' ? d.summary : text(d.summary).trim();
      })
      .catch(function () { return fetchOne(it, (k || 0) + 1); });
  }
  var queue = items.slice(), active = 0, dirty = false;
  function pump() {
    while (active < 4 && queue.length) {
      var it = queue.shift(); active++;
      fetchOne(it).then(function () {
        active--; dirty = true;
        if (!queue.length && !active) { render(); if (current) openSheetIfOpen(); } else pump();
      });
    }
  }
  function openSheetIfOpen() { if (document.body.classList.contains('open') && current) openSheet(current); }
  setInterval(function () { if (dirty) { dirty = false; render(); openSheetIfOpen(); } }, 700);
  pump();
})();
</script>
</body>
</html>

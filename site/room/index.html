<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Приглашение в комнату — AnixQ</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0912">
<link rel="icon" type="image/png" href="../favicon.png">
<meta property="og:title" content="Смотрим аниме вместе в AnixQ">
<meta property="og:description" content="Вас пригласили в комнату совместного просмотра. Откройте ссылку на iPhone или iPad с AnixQ.">
<meta property="og:image" content="https://qmurzik.github.io/AnixQ/og.png">
<style>
  :root { --bg:#0b0912; --text:#f6f4fb; --muted:#a8a3b9; --grad:linear-gradient(115deg,#ff4d7a,#8b5cff); }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--text); text-align:center;
         font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
         background-image:radial-gradient(circle at 20% 0%,rgba(255,77,122,.3),transparent 50%),radial-gradient(circle at 90% 100%,rgba(139,92,255,.35),transparent 55%); }
  img { width:96px; height:96px; border-radius:22px; display:block; margin:0 auto 18px; }
  h1 { font-size:28px; margin:0 0 8px; letter-spacing:-.02em; }
  p { color:var(--muted); margin:0 0 22px; max-width:420px; }
  .btn { display:block; width:100%; max-width:340px; margin:0 auto 12px; padding:15px 22px; border-radius:14px; font-weight:750; text-decoration:none; color:#fff; background:var(--grad); }
  .ghost { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); }
  code { font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <img src="../icon-512.png" alt="AnixQ">
  <h1>Смотрим вместе</h1>
  <p>Вас пригласили в комнату совместного просмотра. Пауза, перемотка и смена серии будут общими для всех.</p>
  <a class="btn" id="open" href="#">Открыть в AnixQ</a>
  <a class="btn ghost" href="../#install">Установить AnixQ</a>
  <p><code id="code"></code></p>
</main>
<script>
  var id = (location.hash || '').replace('#', '').replace(/[^a-z0-9]/gi, '');
  var link = 'anixq://room/' + id;
  document.getElementById('open').href = link;
  document.getElementById('code').textContent = id ? 'Комната ' + id : 'Ссылка неполная';
  if (id && /iPhone|iPad|Macintosh/.test(navigator.userAgent)) { setTimeout(function () { location.href = link; }, 300); }
</script>
</body>
</html>
